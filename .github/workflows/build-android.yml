name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Web App Dependencies
        run: npm install

      - name: Build Web Production Assets (dist)
        run: npm run build

      - name: Install Capacitor CLI & Android Platform
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --no-save
          npx cap add android || true
          npx cap sync android

      - name: Set Android Gradle Permissions
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPay-DevHub-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
